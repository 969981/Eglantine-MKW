name: Eglantine | Schedule isolated nx2 branch

# GitHub only runs scheduled workflows from the default branch.
# This tiny scheduler delegates all sync/build/release logic to the dedicated branch.
# It makes no modifications to any MKW source files or historical branches.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild even if this Eglantine source SHA was published"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  eglantine-nx2:
    name: Run the dedicated Eglantine nx2 pipeline
    permissions:
      contents: write
      actions: read
    uses: 969981/Eglantine-MKW/.github/workflows/eglantine-nx2-autosync.yml@upstream-eglantine-nx2
    with:
      force_build: ${{ inputs.force_build || false }}
