name: Eglantine | Sync nx2 and publish Windows builds

# Default-branch automation. Keeps the user's historical MKW branches untouched.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild and replace release for the same source commit"
        type: boolean
        default: false
  push:
    branches:
      - 2ndAdjustmentVulkanV3-STOP_FORCE_PUSHING_CAMILLE
    paths:
      - .github/workflows/eglantine-upstream-sync-release.yml

concurrency:
  group: eglantine-upstream-nx2-sync-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Mirror Eglantine nx2 source (exclude upstream CI workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.check.outputs.source_sha }}
      mirror_sha: ${{ steps.check.outputs.mirror_sha }}
      tag: ${{ steps.check.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout trusted automation branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream, make safe snapshot, and detect unpublished source
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: |
          set -euo pipefail
          mirror_branch="upstream-eglantine-nx2"
          mirror_ref="refs/heads/$mirror_branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add eglantine-upstream https://github.com/Djihads80/Eglantine.git
          git fetch --no-tags eglantine-upstream refs/heads/nx2
          source_sha="$(git rev-parse FETCH_HEAD)"
          git cat-file -e "${source_sha}^{commit}"

          previous_sha="$(git ls-remote origin "$mirror_ref" | awk '{print $1}')"
          if [ -n "$previous_sha" ]; then
            git fetch --no-tags origin "$mirror_ref:refs/remotes/origin/$mirror_branch"
            git switch -C "$mirror_branch" "refs/remotes/origin/$mirror_branch"
          else
            # An orphan snapshot prevents importing the upstream commit history of
            # .github/workflows, which GITHUB_TOKEN cannot create without
            # workflows permission. All source files and gitlinks are retained.
            git switch --orphan "$mirror_branch"
          fi

          # Git plumbing preserves executable modes, symlinks and submodule
          # gitlinks (unlike copying a working-tree folder).
          git read-tree --reset -u "$source_sha"
          # Workflow files are managed only in the trusted default branch.
          git rm -r -f --cached --ignore-unmatch .github/workflows
          rm -rf .github/workflows
          printf '%s\n' "$source_sha" > .upstream-eglantine.sha
          git add -f .upstream-eglantine.sha
          if git ls-files .github/workflows | grep -q .; then
            echo "::error::Unexpected upstream workflow staged in mirror."
            exit 1
          fi

          changed=false
          if [ -z "$previous_sha" ] || ! git diff --cached --quiet; then
            git commit -m "Mirror Eglantine nx2 $source_sha (source only)"
            # No force push: the independent mirror branch must fast-forward.
            git push origin "HEAD:$mirror_ref"
            changed=true
          fi
          mirror_sha="$(git rev-parse HEAD)"
          short_sha="$(printf '%.12s' "$source_sha")"
          tag="eglantine-nx2-$short_sha"
          published=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            published=true
          fi
          should_build=false
          if [ "$published" = false ] || [ "$FORCE_BUILD" = true ]; then
            should_build=true
          fi
          {
            echo "source_sha=$source_sha"
            echo "mirror_sha=$mirror_sha"
            echo "tag=$tag"
            echo "changed=$changed"
            echo "should_build=$should_build"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Eglantine nx2 synchronization"
            echo "- Source: `Djihads80/Eglantine@nx2`"
            echo "- Upstream commit: `$source_sha`"
            echo "- Mirror commit: `$mirror_sha`"
            echo "- Mirror branch: `$mirror_branch`"
            echo "- Previous mirror SHA: `${previous_sha:-none}`"
            echo "- Source snapshot changed: `$changed`"
            echo "- Upstream GitHub workflows excluded (token permissions)"
            echo "- Release: `$tag` (already published: `$published`)"
            echo "- Build requested: `$should_build`"
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Build upstream Windows x64
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    permissions:
      contents: read
    uses: Djihads80/Eglantine/.github/workflows/build-windows.yml@nx2
    with:
      # Build the mirrored source commit; it retains code, submodules and tools.
      sha: ${{ needs.sync.outputs.mirror_sha }}
      version: ${{ needs.sync.outputs.source_sha }}
      refspec: nx2
      tag: ${{ needs.sync.outputs.tag }}
      release: true
      nightly: true
      pgo: none

  publish:
    name: Publish validated Eglantine nx2 prerelease
    needs: [sync, windows]
    if: needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.sync.outputs.source_sha }}
      MIRROR_SHA: ${{ needs.sync.outputs.mirror_sha }}
      RELEASE_TAG: ${{ needs.sync.outputs.tag }}
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: eglantine-windows-x86_64-${{ needs.sync.outputs.mirror_sha }}
          path: dist/bin

      - name: Verify and package Windows portable binaries
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/bin/eglantine.exe
          test -s dist/bin/eden-cli.exe
          cat > dist/bin/BUILD-INFO.txt <<EOF
          Experimental Eglantine nx2 Windows x64 build.
          Upstream commit: $SOURCE_SHA
          Mirrored source commit: $MIRROR_SHA
          Upstream: https://github.com/Djihads80/Eglantine
          Mirrored source: https://github.com/$GITHUB_REPOSITORY/tree/upstream-eglantine-nx2
          No games, firmware, or encryption keys are included.
          EOF
          mkdir -p release-assets
          (cd dist/bin && zip -q -r ../../release-assets/Eglantine-nx2-Windows-x64.zip .)
          test -s release-assets/Eglantine-nx2-Windows-x64.zip

      - name: Publish prerelease only after build succeeds
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Automated experimental Eglantine nx2 build from
          [upstream $SOURCE_SHA](https://github.com/Djihads80/Eglantine/commit/$SOURCE_SHA).

          Source snapshot: [mirror $MIRROR_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$MIRROR_SHA).
          Upstream CI workflow files are not mirrored; this repository manages its own automation.
          Historical Eglantine-MKW development branches are left unchanged.

          Windows x64 portable ZIP includes GUI, CLI and Qt runtime.
          No commercial games, firmware or encryption keys are included.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$MIRROR_SHA" \
              --title "Eglantine nx2 $SOURCE_SHA (Windows x64)" \
              --notes-file release-notes.md --prerelease
          fi
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
